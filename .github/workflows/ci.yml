name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm turbo typecheck

      - name: Test — server
        run: pnpm --filter @clip/server test

      - name: Test — app
        run: pnpm --filter @clip/app test

      - name: Build (verify no broken imports)
        run: pnpm turbo build
        env:
          # Prevent Remotion from trying to launch Chromium in CI
          REMOTION_SKIP_CHROME_DOWNLOAD: 1
